services:
  db:
    image: postgres:18-alpine
    container_name: financeapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financeapp}
      POSTGRES_USER: ${DB_USER:-financeapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      # So na propria maquina; nao expor o banco na rede.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - financeapp-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financeapp} -d ${DB_NAME:-financeapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: financeapp-adminer
    # Opcional: so sobe com `docker compose --profile tools up -d`.
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  financeapp-db-data:
