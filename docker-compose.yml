services:
  db:
    image: postgres:18-alpine
    container_name: financeapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financeapp}
      POSTGRES_USER: ${DB_USER:-financeapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financeapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - financeapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-financeapp} -d ${DB_NAME:-financeapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: financeapp-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  financeapp-db-data:
