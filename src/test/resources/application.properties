
spring.application.name=financeapp

spring.datasource.url=jdbc:h2:mem:financeapp-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true

app.security.jwt.secret=test-only-secret-0123456789-0123456789-abcdef
app.security.jwt.expiration=1h

logging.level.org.springframework.web=WARN
