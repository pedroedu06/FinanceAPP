# Perfil dos testes (@ActiveProfiles("test")). So o que difere de application.properties.
spring.datasource.url=jdbc:h2:mem:financeapp-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

app.security.jwt.secret=test-only-secret-0123456789-0123456789-abcdef

# Todos os testes saem do mesmo IP; o limite real e exercitado em RateLimitIntegrationTest.
app.security.rate-limit.login-per-minute=100000
app.security.rate-limit.register-per-hour=100000

logging.level.org.springframework.web=WARN
