# Perfil postgres: aponta para o banco subido pelo docker-compose.yml.
# Valores vem do .env (veja .env.example) ou das variaveis de ambiente.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financeapp}
spring.datasource.username=${DB_USER:financeapp}
spring.datasource.password=${DB_PASSWORD:financeapp}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
