spring.application.name=financeapp

# Nao ha perfil padrao de proposito: sem perfil, a aplicacao so sobe com banco e
# JWT_SECRET configurados. Para desenvolver, use o perfil dev (./mvnw spring-boot:run
# ja o ativa); com PostgreSQL, o perfil postgres.

# O Flyway e a unica fonte de verdade do schema; o Hibernate so valida o mapeamento.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true

# Actuator: so o health, e sem detalhes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT. O segredo vem do ambiente (JWT_SECRET); sem ele a aplicacao nao sobe.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=1h

# Limite por IP nas rotas publicas.
app.security.rate-limit.login-per-minute=10
app.security.rate-limit.register-per-hour=10
