# Perfil dev: H2 em memoria rodando em modo de compatibilidade PostgreSQL,
# para que as migrations do Flyway sejam as mesmas usadas em producao.
spring.datasource.url=jdbc:h2:mem:financeapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

management.endpoint.health.show-details=always

# Usuario fixo apenas para desenvolvimento local. Nao usar em outros perfis.
spring.security.user.name=dev
spring.security.user.password=dev
spring.security.user.roles=ADMIN
